name: Build Linux DEB

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-deb:
    runs-on: ubuntu-latest

    steps:
      # ------------------------------------------------------------
      # 1) Checkout
      # ------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      # 2) Java 21 + JavaFX (Liberica jdk+fx)
      # ------------------------------------------------------------
      - name: Set up JDK 21 (Liberica + JavaFX)
        uses: actions/setup-java@v4
        with:
          distribution: liberica
          java-version: "21"
          java-package: jdk+fx
          cache: maven

      # ------------------------------------------------------------
      # 3) DEB tooling
      # ------------------------------------------------------------
      - name: Install DEB tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot dpkg-dev

      # ------------------------------------------------------------
      # 4) Maven package (shade erzeugt -app.jar)
      # ------------------------------------------------------------
      - name: Build project with Maven
        run: mvn -B -Plinux -DskipTests package

      # ------------------------------------------------------------
      # 5) jpackage -> .deb (Typ kommt aus pom.xml: <jpackage.type>DEB</jpackage.type>)
      # ------------------------------------------------------------
      - name: Build DEB with jpackage
        run: mvn -B -Plinux -DskipTests jpackage:jpackage

      # ------------------------------------------------------------
      # 6) Artifact hochladen
      # ------------------------------------------------------------
      - name: Upload DEB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KeyDust-Linux-DEB
          path: |
            dist/**/*.deb

      # ------------------------------------------------------------
      # 7) Bei Tag zusätzlich ans GitHub Release hängen
      # ------------------------------------------------------------
      - name: Publish DEB to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/**/*.deb
