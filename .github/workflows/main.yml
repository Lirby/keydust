name: Build Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build Fat JAR + jpackage
        run: mvn clean package -Pwindows

      - name: Show dist contents (debug)
        run: dir target\dist

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: KeyDust-Windows
          path: target/dist/*.exe
