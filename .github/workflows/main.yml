name: Build Windows MSI

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-msi:
    runs-on: windows-latest

    steps:
      # ------------------------------------------------------------
      # 1) Repository auschecken
      # ------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      # 2) Java 21 + JavaFX (Liberica Full / jdk+fx)
      # ------------------------------------------------------------
      - name: Set up JDK 21 (Liberica + JavaFX)
        uses: actions/setup-java@v4
        with:
          distribution: liberica
          java-version: "21"
          java-package: jdk+fx
          cache: maven

      # ------------------------------------------------------------
      # 3) WiX Toolset installieren (MSI ist sonst unmöglich)
      # ------------------------------------------------------------
      - name: Install WiX Toolset
        shell: pwsh
        run: choco install wixtoolset --no-progress -y

      # ------------------------------------------------------------
      # 4) Maven Build (JAR + Shade etc.)
      # ------------------------------------------------------------
      - name: Build project with Maven
        shell: pwsh
        run: mvn -B -Pwindows -DskipTests package

      # ------------------------------------------------------------
      # 5) MSI mit jpackage erzeugen
      #    (Typ kommt aus pom.xml: <jpackage.type>msi</jpackage.type>)
      # ------------------------------------------------------------
      - name: Build MSI with jpackage
        shell: pwsh
        run: mvn -B -Pwindows -DskipTests jpackage:jpackage

      # ------------------------------------------------------------
      # 6) MSI als Artifact hochladen
      # ------------------------------------------------------------
      - name: Upload MSI Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KeyDust-Windows-MSI
          path: |
            dist/**/*.msi

      # ------------------------------------------------------------
      # 7) MSI an GitHub Release anhängen (nur bei Tags)
      # ------------------------------------------------------------
      - name: Publish MSI to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/**/*.msi
