name: Build .deb (Debian 13 / trixie)

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  debian13-deb:
    runs-on: ubuntu-latest

    # Build läuft IN Debian 13 (trixie)
    container:
      image: debian:trixie-slim

    steps:
      - name: Install base tooling
        shell: bash
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git \
            maven \
            fakeroot dpkg-dev \
            xz-utils zip unzip
          update-ca-certificates

      - name: Checkout repository
        uses: actions/checkout@v4

      # JDK 21 + JavaFX (Liberica jdk+fx) – zuverlässig für JavaFX + jpackage
      - name: Set up JDK 21 (Liberica + JavaFX)
        uses: actions/setup-java@v4
        with:
          distribution: liberica
          java-version: "21"
          java-package: jdk+fx
          cache: maven

      # 1) fat jar bauen (shade erzeugt target/Keydust-1.0.0-app.jar)
      - name: Maven package
        shell: bash
        run: mvn -B -Plinux -DskipTests package

      # 2) .deb via jpackage (Typ kommt aus deinem pom: <jpackage.type>DEB</jpackage.type>)
      - name: Build DEB with jpackage
        shell: bash
        run: mvn -B -Plinux -DskipTests jpackage:jpackage

      - name: Upload DEB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KeyDust-Debian13-DEB
          path: |
            dist/**/*.deb

      - name: Publish DEB to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/**/*.deb
